name: binary-cache

# Construye SOLO lo que cache.nixos.org nunca puede tener: los paquetes que
# nacen en los overlays de este flake (y que por lo tanto compilan en cada host
# en cada bump). El resto del sistema (libreoffice, kicad, JDKs...) lo sirve
# cache.nixos.org y no se toca aca.
#
# Los runners de GitHub tienen ~14 GB de disco: construir un toplevel completo
# (48 GB de closure) es imposible, y ademas innecesario. Por eso se construyen
# los paquetes sueltos, no `nixosConfigurations.<host>`.
#
# El nombre de la cache tiene que coincidir con `binaryCacheName` en
# modules/core/nix-optimization.nix.

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      # El propio workflow: sin esto, editarlo no re-ejecuta la cache.
      - ".github/workflows/**"
  schedule:
    # Diario: recalienta la cache despues de cada bump de canal.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: binary-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            # Kernel CachyOS cacheado por chaotic: sin esto, construir ddcci
            # arrastra la compilacion del kernel en el runner.
            extra-substituters = https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      - uses: cachix/cachix-action@v15
        with:
          name: ayrxz47-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # watch-exec sube automaticamente todo lo que la corrida construya.
      - name: Construir y subir los paquetes no cacheados upstream
        run: |
          cachix watch-exec ayrxz47-nixos-config -- nix build -L --no-link \
            .#packages.x86_64-linux.openrocket \
            .#packages.x86_64-linux.pi \
            .#nixosConfigurations.pc.pkgs.hypr-kdeconnect-fix \
            .#nixosConfigurations.pc.pkgs.caelestia-shell \
            .#nixosConfigurations.pc.pkgs.caelestia-cli \
            .#nixosConfigurations.pc.pkgs.opencode \
            .#nixosConfigurations.pc.pkgs.bibata-material-deep-blue \
            .#nixosConfigurations.pc.pkgs.kicad-spice-library

      # omnetpp NO esta en nixpkgs: lo construye modules/apps/omnetpp.nix
      # (clangStdenv + Qt6, desde el tarball oficial). Por eso no existe como
      # paquete del flake y cache.nixos.org nunca lo va a tener; es el paquete
      # mas caro del repo (~689 MB). Se resuelve por evaluacion del host y se
      # construye por drvPath.
      - name: Construir y subir omnetpp (definido en un modulo, no en nixpkgs)
        run: |
          drv=$(nix eval --impure --raw --expr 'let f = builtins.getFlake (toString ./.); ps = f.nixosConfigurations.pc.config.environment.systemPackages; in (builtins.head (builtins.filter (p: builtins.match "omnetpp.*" (p.name or "") != null) ps)).drvPath')
          cachix watch-exec ayrxz47-nixos-config -- nix-store --realise "$drv"

      # ddcci es el unico paquete del pc que no esta en nixpkgs ni en Hydra:
      # es un modulo fuera del arbol que depende del kernel CachyOS. Sin esto
      # el pc lo compila (y arrastra kmodigest) en cada rebuild.
      - name: Construir y subir ddcci del pc
        run: |
          # El --option explicito es obligatorio: cachix-action pisa el
          # NIX_CONFIG y el kernel CachyOS terminaria compilando en el runner.
          nyx='--option extra-substituters https://nyx-cache.chaotic.cx/ --option extra-trusted-public-keys nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk='
          cachix watch-exec ayrxz47-nixos-config -- nix build --no-link -L --impure $nyx \
            --expr 'let f = builtins.getFlake (toString ./.); in (builtins.head f.nixosConfigurations.pc.config.boot.extraModulePackages)'
